services:
  hush:
    build: .
    image: hush:local
    container_name: hush
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - hush-data:/var/lib/hush
    environment:
      HUSH_LISTEN: "0.0.0.0:8443"
      HUSH_DATA_DIR: "/var/lib/hush"
      HUSH_KEK_KIND: "file"
      HUSH_KEK_FILE: "/var/lib/hush/kek"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8443/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  hush-data:
