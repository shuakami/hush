[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-cli"
version = "0.1.0"
description = "Hush — credential & access broker client for Python (SDK + paramiko shim + migrate scanner)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "shuakami", email = "shuakami@sdjz.wiki" },
]
keywords = ["hush", "ssh", "credentials", "vault", "secrets", "paramiko", "broker", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
migrate = []  # uses only stdlib (ast, tokenize)

[project.urls]
Homepage = "https://github.com/shuakami/hush"
Repository = "https://github.com/shuakami/hush"
Issues = "https://github.com/shuakami/hush/issues"

[project.scripts]
hush-py = "hush.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hush"]
