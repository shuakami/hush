<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hush banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a0a; }
  body {
    width: 1600px;
    height: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }
  .wordmark {
    font-size: 192px;
    font-weight: 800;
    color: #fafafa;
    letter-spacing: -0.055em;
    line-height: 1;
  }
  .wordmark .stop { color: #71717a; }
  .tagline {
    margin-top: 36px;
    font-size: 19px;
    font-weight: 400;
    color: #a1a1aa;
    letter-spacing: -0.005em;
  }
  .tagline .em { color: #fafafa; font-weight: 500; }
</style>
</head>
<body>
  <div class="wordmark">hush<span class="stop">.</span></div>
  <div class="tagline">Credentials, <span class="em">brokered</span>. For humans, scripts, and AI agents.</div>
</body>
</html>
